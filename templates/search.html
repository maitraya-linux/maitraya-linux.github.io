{% extends "base.html" %}

{% block main %}
<div class="search-page">
  <h1>search</h1>
  <input type="text" id="search-input" placeholder="Type to search..." aria-label="Search" autofocus>
  <div id="search-results" class="search-results-list"></div>
</div>

<script defer src="{{ get_url(path="search_index.en.js") | safe }}"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/elasticlunr/0.9.6/elasticlunr.min.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.querySelector('#search-input');
    const searchResults = document.querySelector('#search-results');
    let index;

    const initSearch = () => {
      if (index) return;
      if (!window.searchIndex) return;
      index = elasticlunr.Index.load(window.searchIndex);
    };

    searchInput.addEventListener('input', () => {
      initSearch();
      const query = searchInput.value.trim();
      if (query.length < 2) {
        searchResults.innerHTML = '';
        return;
      }

      const results = index.search(query, {
        bool: "AND",
        expand: true
      });

      searchResults.innerHTML = '';
      if (results.length > 0) {
        results.forEach(result => {
          const item = index.documentStore.getDoc(result.ref);
          const div = document.createElement('div');
          div.className = 'search-result-item-page';
          
          // Simple excerpt logic
          let excerpt = item.body;
          const queryLower = query.toLowerCase();
          const indexMatch = excerpt.toLowerCase().indexOf(queryLower);
          if (indexMatch !== -1) {
            const start = Math.max(0, indexMatch - 50);
            const end = Math.min(excerpt.length, indexMatch + 150);
            excerpt = (start > 0 ? '...' : '') + excerpt.substring(start, end) + (end < excerpt.length ? '...' : '');
          } else {
            excerpt = excerpt.substring(0, 200) + '...';
          }

          div.innerHTML = `
            <h2><a href="${item.id}">${item.title}</a></h2>
            <p>${excerpt}</p>
          `;
          searchResults.appendChild(div);
        });
      } else {
        searchResults.innerHTML = '<p>No results found for "' + query + '"</p>';
      }
    });
  });
</script>
{% endblock %}
